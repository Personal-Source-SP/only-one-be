name: Dev CI
run-name: "Branch ${{ github.ref_name }} - #${{ github.run_number }}"

on:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            registry:
                description: 'Docker Registry/Username'
                required: true
                default: 'sevenpain'
            image_name:
                description: 'Docker Image Name'
                required: true
                default: 'only-one-backend'

env:
    REGISTRY: ${{ inputs.registry || 'sevenpain' }}
    IMAGE_NAME: ${{ inputs.image_name || 'only-one-backend' }}
    ESLINT_USE_FLAT_CONFIG: false

jobs:
    validate:
        name: Validate and Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Validate code formatting
              run: npx prettier --check .

            - name: Lint code
              run: npm run lint

            - name: Run unit tests (if any)
              run: npm run test --if-present

    build-and-push:
        name: Build & Push Docker Image
        needs: validate
        runs-on: ubuntu-latest
        environment: DOCKER

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                  build-args: |
                      SWAGGER_VERSION=${{ github.run_number }}
                      VCS_REF=${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
